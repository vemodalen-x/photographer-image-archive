name: Windows build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-release.lock
      - name: Install locked release dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-release.lock
      - name: Test and lint
        run: |
          python -m pytest -q
          python -m ruff check .
          python -m compileall -q photo_archive_app.py photo_archive_cli.py photo_archive_core.py photo_archive_version.py tools tests
      - name: Audit public source
        run: python tools/audit_public_source.py .
      - name: Build and verify Windows package
        run: python build_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhotographerImageArchive-windows-x64
          path: |
            dist/PhotographerImageArchive-1.0.0-windows-x64.zip
            dist/SHA256SUMS-v1.0.0.txt
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PhotographerImageArchive-windows-x64
          path: dist
      - name: Publish exact tag assets without screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          package="dist/PhotographerImageArchive-$version-windows-x64.zip"
          checksums="dist/SHA256SUMS-v$version.txt"
          gh release create "$GITHUB_REF_NAME" \
            "$package" \
            "$checksums" \
            --title "Photographer Image Archive $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
