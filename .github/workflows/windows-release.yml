name: Windows build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Bootstrap checksum-pinned Miniconda and runtime
        shell: pwsh
        run: |
          $installerName = "Miniconda3-py312_25.5.1-1-Windows-x86_64.exe"
          $installer = Join-Path $env:RUNNER_TEMP $installerName
          $installerUrl = "https://repo.anaconda.com/miniconda/$installerName"
          $expectedSha256 = "0905638dcd7bb214261fe0ac6136d4dbbb9c4266fa3cf4c5bf4ffce834ae5357"
          Invoke-WebRequest -UseBasicParsing -Uri $installerUrl -OutFile $installer
          $actualSha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Miniconda installer checksum mismatch: $actualSha256"
          }
          $miniconda = Join-Path $env:RUNNER_TEMP "photo-archive-miniconda"
          $process = Start-Process -FilePath $installer -ArgumentList "/InstallationType=JustMe", "/RegisterPython=0", "/AddToPath=0", "/S", "/D=$miniconda" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Miniconda installer exited with code $($process.ExitCode)"
          }
          $conda = Join-Path $miniconda "Scripts\conda.exe"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\create_locked_conda_env.ps1 -CondaExecutable $conda -Destination .\.venv-release
          if ($LASTEXITCODE -ne 0) {
            throw "Locked runtime bootstrap failed with exit code $LASTEXITCODE"
          }
      - name: Install locked release dependencies
        shell: pwsh
        run: .\.venv-release\python.exe -m pip install --disable-pip-version-check --require-hashes -r requirements-release.lock
      - name: Test and lint
        shell: pwsh
        run: |
          .\.venv-release\python.exe -m pytest -q
          .\.venv-release\python.exe -m ruff check .
          .\.venv-release\python.exe -m compileall -q photo_archive_app.py photo_archive_cli.py photo_archive_core.py photo_archive_version.py tools tests
      - name: Audit public source
        shell: pwsh
        run: .\.venv-release\python.exe tools/audit_public_source.py .
      - name: Build and verify Windows package
        shell: pwsh
        run: .\.venv-release\python.exe build_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhotographerImageArchive-windows-x64
          path: |
            dist/PhotographerImageArchive-1.0.0-windows-x64.zip
            dist/SHA256SUMS-v1.0.0.txt
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PhotographerImageArchive-windows-x64
          path: dist
      - name: Publish exact tag assets without screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          package="dist/PhotographerImageArchive-$version-windows-x64.zip"
          checksums="dist/SHA256SUMS-v$version.txt"
          gh release create "$GITHUB_REF_NAME" \
            "$package" \
            "$checksums" \
            --title "Photographer Image Archive $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
